<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ticket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Film strip / ticket shape -->
  <g transform="translate(32,32)">
    <!-- Movie ticket body -->
    <rect x="-20" y="-14" width="40" height="28" rx="4" fill="url(#ticket)" opacity="0.95"/>
    <!-- Ticket notches -->
    <circle cx="-20" cy="0" r="4" fill="url(#bg)"/>
    <circle cx="20" cy="0" r="4" fill="url(#bg)"/>
    <!-- Film perforations top -->
    <rect x="-16" y="-12" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="-8" y="-12" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="0" y="-12" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="8" y="-12" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <!-- Film perforations bottom -->
    <rect x="-16" y="9" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="-8" y="9" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="0" y="9" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <rect x="8" y="9" width="4" height="3" rx="1" fill="url(#bg)" opacity="0.3"/>
    <!-- Play button triangle -->
    <polygon points="-5,-7 -5,7 9,0" fill="url(#bg)" opacity="0.85"/>
  </g>
  <!-- Subtle shine -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="white" opacity="0.08"/>
</svg>